# CI cho cả hai phần của dự án. File này PHẢI nằm ở .github/workflows/ của thư mục gốc repo (GitHub không đọc workflow ở thư mục con);
# mọi đường dẫn trỏ vào data-cleaning-platform/.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: data_cleaning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: data-cleaning-platform/backend

    env:
      # conftest.py tự thêm hậu tố "_test" -> kết nối tới data_cleaning_test (khớp POSTGRES_DB bên trên)
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/data_cleaning
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-cleaning-platform/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with black
        run: black --check .

      # Phát hiện model và migration bị lệch: `alembic check` lỗi nếu model có thay đổi chưa có migration.
      # Dùng chính database của CI (data_cleaning_test), rồi downgrade về trống để pytest tạo bảng lại.
      - name: Check migrations match models
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/data_cleaning_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade 0001
          alembic upgrade head
          alembic check
          alembic downgrade base

      # Ghi tên các test lỗi thành annotation của job để xem được ngay trên trang kết quả (không cần mở log).
      - name: Run tests
        shell: bash
        run: |
          set +e
          pytest -q --tb=short -rfE 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(grep -E '^(FAILED|ERROR) |^E  ' pytest.log | head -25 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=pytest lỗi::${summary}"
          fi
          exit $status

  frontend:
    name: frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: data-cleaning-platform/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-cleaning-platform/frontend/requirements.txt

      # Test chạy bằng AppTest của Streamlit với backend giả (FRONTEND_MOCK do tests/conftest.py đặt).
      - name: Install dependencies
        run: pip install -r requirements.txt pytest==8.3.4 ruff==0.8.4

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Run tests
        run: pytest
