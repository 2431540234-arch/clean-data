[theme]
# Chỉ giao diện sáng. Widget Streamlit (nút chính, checkbox, toggle, slider, tab...) tự dùng
# primaryColor; token cho component tự dựng nằm ở assets/styles.css.
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[client]
# Ẩn nút Deploy; giữ menu cơ bản.
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
